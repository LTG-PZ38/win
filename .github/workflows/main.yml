name: Windows - RustDesk 远程桌面
on:
  workflow_dispatch:
jobs:
  build:
    name: 开始构建...
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: 下载并执行安装脚本（PowerShell）
        run: |
          curl -L -o downloads.ps1 "https://r2.ctn32.us.kg/raw/windows/downloads.bat"
          pwsh -ExecutionPolicy Bypass -File downloads.ps1

      - name: 显示 RustDesk 登录凭证
        run: |
          cd $env:USERPROFILE
          if (Test-Path credentials.txt) {
              Write-Host "===== RustDesk 登录凭证 ====="
              Get-Content credentials.txt
              Write-Host "============================="
          } else {
              Write-Host "警告：未找到 credentials.txt，请检查 login.py 是否正常执行。"
              Write-Host "但上方 Python 日志中可能已打印凭证，请向上滚动查看。"
          }

      - name: 环境测试与保活
        run: |
          cd $env:USERPROFILE
          Write-Host "===== 开始测试 RustDesk 状态 ====="
          $proc = Get-Process -Name "rustdesk" -ErrorAction SilentlyContinue
          if ($proc) {
              Write-Host "RustDesk 进程正在运行，PID: $($proc.Id)"
          } else {
              Write-Host "警告：未找到 RustDesk 进程！"
          }
          Write-Host "测试中继服务器连通性..."
          Test-Connection relay.rustdesk.com -Count 2 -ErrorAction SilentlyContinue
          Write-Host "===== 测试完成，进入保活循环 ====="
          Write-Host "请使用上方显示的 RustDesk ID 和密码连接。"
          $counter = 0
          while ($true) {
              Start-Sleep -Seconds 60
              $counter++
              Write-Host "[$counter] 保持连接中，运行时间：$((Get-Date).ToString('HH:mm:ss'))"
          }

      - name: 时间计数器
        run: |
          cd $env:USERPROFILE
          python time.py
